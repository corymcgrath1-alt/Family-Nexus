kind = "web"
previewPath = "/"
title = "FamilySpace"
version = "1.0.0"
id = "artifacts/family-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25045

[services.development]
run = "pnpm --filter @workspace/family-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/family-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25045"
BASE_PATH = "/"
