name: Lighthouse Privacy Verification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/lighthouse-core
      - main
    paths:
      - ".github/workflows/lighthouse-privacy.yml"
      - "artifacts/api-server/**"
      - "artifacts/family-app/**"
      - "docs/development/database-testing.md"
      - "docs/architecture/**"
      - "docs/connectors/**"
      - "docs/data-classification.md"
      - "docs/data-lifecycle-map.md"
      - "docs/roadmap.md"
      - "docs/security-threat-model.md"
      - "lib/db/**"
      - "lib/knowledge-model/**"
      - "package.json"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "tests/e2e/**"
  pull_request:
    paths:
      - ".github/workflows/lighthouse-privacy.yml"
      - "artifacts/api-server/**"
      - "artifacts/family-app/**"
      - "docs/development/database-testing.md"
      - "docs/architecture/**"
      - "docs/connectors/**"
      - "docs/data-classification.md"
      - "docs/data-lifecycle-map.md"
      - "docs/roadmap.md"
      - "docs/security-threat-model.md"
      - "lib/db/**"
      - "lib/knowledge-model/**"
      - "package.json"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "tests/e2e/**"

jobs:
  privacy-verification:
    name: Migration, API, E2E, And Builds
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lighthouse_test
          POSTGRES_PASSWORD: lighthouse_test_password
          POSTGRES_DB: lighthouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lighthouse_test -d lighthouse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_MIGRATION_URL: postgres://lighthouse_test:lighthouse_test_password@127.0.0.1:5432/lighthouse_test
      DATABASE_URL: postgres://lighthouse_test_app:lighthouse_test_app_password@127.0.0.1:5432/lighthouse_test
      TEST_DATABASE_MIGRATION_URL: postgres://lighthouse_test:lighthouse_test_password@127.0.0.1:5432/lighthouse_test
      TEST_DATABASE_URL: postgres://lighthouse_test_app:lighthouse_test_app_password@127.0.0.1:5432/lighthouse_test
      TEST_CONNECTOR_WORKER_DATABASE_URL: postgres://lighthouse_test_worker:lighthouse_test_worker_password@127.0.0.1:5432/lighthouse_test
      CONNECTOR_WORKER_DATABASE_URL: postgres://lighthouse_test_worker:lighthouse_test_worker_password@127.0.0.1:5432/lighthouse_test
      SESSION_SECRET: ci-lighthouse-privacy-session-secret
      CONNECTOR_PROVIDER_MODE: fake
      CONNECTOR_ACTIVE_KEY_VERSION: ci-v1
      CONNECTOR_CREDENTIAL_KEYS_JSON: '{"ci-v1":"BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc="}'
      CONNECTOR_APP_ORIGIN: http://127.0.0.1:5173
      PORT: "5173"
      BASE_PATH: /
      API_PORT: "5000"
      FAMILY_APP_PORT: "5173"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.3 --activate
          pnpm --version
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Apply clean database migrations
        run: pnpm run db:test:migrate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Policy unit tests
        run: pnpm run test:library-policy

      - name: Knowledge model unit tests
        run: pnpm run test:knowledge-model

      - name: Connector platform unit tests
        run: pnpm run test:connector-platform

      - name: Database-backed API integration tests
        run: pnpm run test:integration

      - name: Restricted connector worker smoke
        run: pnpm run connector:worker:once

      - name: Browser E2E privacy tests
        run: pnpm run test:e2e

      - name: Verify generated API contracts
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: API production build
        run: pnpm --filter @workspace/api-server run build

      - name: Family app production build
        run: pnpm --filter @workspace/family-app run build

      - name: Full workspace build
        run: pnpm run build
