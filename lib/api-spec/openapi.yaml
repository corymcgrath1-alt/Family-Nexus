openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Lighthouse API - consent-native family intelligence operating system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: family-members
    description: Family member profiles and preferences
  - name: experiences
    description: Experience recommendations and interactions
  - name: invitations
    description: Invitation builder and RSVP flow
  - name: calendar-events
    description: Shared family calendar
  - name: planning-tasks
    description: Planning tasks for upcoming events
  - name: memories
    description: Saved experience ideas and memories
  - name: reflections
    description: Post-experience reflections
  - name: messages
    description: Family messages
  - name: shortlist
    description: Shortlisted experiences
  - name: today
    description: Today dashboard summary
  - name: connectors
    description: User-owned connector authorization, consent, resources, and synchronization

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /family-members:
    get:
      operationId: listFamilyMembers
      tags: [family-members]
      summary: List all family members
      responses:
        "200":
          description: List of family members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyMember"

  /family-members/{id}:
    get:
      operationId: getFamilyMember
      tags: [family-members]
      summary: Get a family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "404":
          description: Not found

  /family-members/{id}/profile:
    get:
      operationId: getMemberProfile
      tags: [family-members]
      summary: Get experience profile for a family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experience profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceProfile"
        "404":
          description: Not found
    patch:
      operationId: updateMemberProfile
      tags: [family-members]
      summary: Update experience profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceProfile"

  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: List experience recommendations
      parameters:
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [right-now, this-week, this-weekend, this-month, this-season, this-year, surprise]
        - name: participants
          in: query
          schema:
            type: string
        - name: maxCost
          in: query
          schema:
            type: number
        - name: maxDistance
          in: query
          schema:
            type: number
        - name: energyLevel
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: setting
          in: query
          schema:
            type: string
            enum: [home, indoor, outdoor, any]
        - name: needsChildcare
          in: query
          schema:
            type: boolean
        - name: surpriseMode
          in: query
          schema:
            type: boolean
        - name: savedOnly
          in: query
          schema:
            type: boolean
        - name: shortlistedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"

  /experiences/search:
    get:
      operationId: searchExperiences
      tags: [experiences]
      summary: Natural language experience search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: viewerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results with parsed filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceSearchResult"

  /experiences/{id}:
    get:
      operationId: getExperience
      tags: [experiences]
      summary: Get a single experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experience detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "404":
          description: Not found

  /experiences/{id}/save:
    post:
      operationId: saveExperience
      tags: [experiences]
      summary: Save or unsave an experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceActionInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /experiences/{id}/hide:
    post:
      operationId: hideExperience
      tags: [experiences]
      summary: Hide or unhide an experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceActionInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /experiences/{id}/shortlist:
    post:
      operationId: shortlistExperience
      tags: [experiences]
      summary: Add or remove experience from shortlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceActionInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List all invitations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, suggested-change, needs-info, declined, cancelled]
        - name: memberId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Create a new invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"

  /invitations/{id}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Get an invitation by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Not found
    patch:
      operationId: updateInvitation
      tags: [invitations]
      summary: Update invitation or submit RSVP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationUpdate"
      responses:
        "200":
          description: Updated invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Not found

  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar-events]
      summary: List calendar events
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar-events]
      summary: Add event to shared calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /planning-tasks:
    get:
      operationId: listPlanningTasks
      tags: [planning-tasks]
      summary: List planning tasks
      parameters:
        - name: calendarEventId
          in: query
          schema:
            type: string
        - name: invitationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of planning tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningTask"

  /planning-tasks/{id}:
    patch:
      operationId: updatePlanningTask
      tags: [planning-tasks]
      summary: Update a planning task (toggle complete, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningTaskUpdate"
      responses:
        "200":
          description: Updated planning task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningTask"

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List experience memories
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, postponed, completed, archived]
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Save a memory or idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update memory status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /reflections:
    get:
      operationId: listReflections
      tags: [reflections]
      summary: List post-experience reflections
      responses:
        "200":
          description: List of reflections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reflection"
    post:
      operationId: createReflection
      tags: [reflections]
      summary: Submit a post-experience reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionInput"
      responses:
        "201":
          description: Created reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reflection"

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List family messages
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /today:
    get:
      operationId: getTodaySummary
      tags: [today]
      summary: Get today dashboard summary
      parameters:
        - name: viewerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Today summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummary"

  /connectors/definitions:
    get:
      operationId: listConnectorDefinitions
      tags: [connectors]
      summary: List available connector definitions
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Immutable connector definitions in stable key order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /connectors/connections:
    get:
      operationId: listConnectorConnections
      tags: [connectors]
      summary: List connections owned by the authenticated adult
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Actor-owned connections only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connectors/connections/{connectionId}:
    get:
      operationId: getConnectorConnection
      tags: [connectors]
      summary: Get an actor-owned connection
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection status without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connectors/google-calendar/authorize:
    post:
      operationId: beginGoogleCalendarAuthorization
      tags: [connectors]
      summary: Create one-time OAuth state and begin read-only Google authorization
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginConnectorAuthorizationRequest" }
      responses:
        "201":
          description: Authorization URL; no provider token is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeginConnectorAuthorizationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connectors/google-calendar/oauth/callback:
    get:
      operationId: completeGoogleCalendarAuthorization
      tags: [connectors]
      summary: Consume one-time Google OAuth state and complete provider authorization
      description: Requires the same authenticated Lighthouse session that began authorization. Success and provider denial redirect to the configured application origin without exposing tokens.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 1000 }
        - name: code
          in: query
          schema: { type: string, minLength: 1, maxLength: 4000 }
        - name: error
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "303":
          description: Redirect to the allowlisted Lighthouse application origin
          headers:
            Location:
              required: true
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connectors/connections/{connectionId}/discover:
    post:
      operationId: discoverConnectorResources
      tags: [connectors]
      summary: Discover provider resources without selecting them
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Calendars visible to the connected provider account
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connectors/connections/{connectionId}/resources:
    get:
      operationId: listConnectorResources
      tags: [connectors]
      summary: List discovered resources for an actor-owned connection
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Provider resources and explicit selection state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateConnectorResources
      tags: [connectors]
      summary: Replace the explicit calendar selection
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorResourceSelectionRequest" }
      responses:
        "200":
          description: Updated resource selections; changed active selections require renewed consent
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connectors/connections/{connectionId}/consent:
    post:
      operationId: confirmConnectorConsent
      tags: [connectors]
      summary: Record explicit Lighthouse import consent after provider authorization
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorConsentRequest" }
      responses:
        "201":
          description: Active private-by-default connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connectors/connections/{connectionId}/sync:
    post:
      operationId: runConnectorSync
      tags: [connectors]
      summary: Run a bounded manual or initial synchronization
      description: Persists each provider page atomically before advancing its checkpoint. Imported events remain private.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "202":
          description: Completed durable sync run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorSyncRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderFailure" }

  /connectors/connections/{connectionId}/sync-runs:
    get:
      operationId: listConnectorSyncRuns
      tags: [connectors]
      summary: List redacted sync history for an actor-owned connection
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Redacted sync runs without cursors or provider payloads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorSyncRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connectors/connections/{connectionId}/pause:
    post:
      operationId: pauseConnectorConnection
      tags: [connectors]
      summary: Pause synchronization
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Paused connection
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorConnection" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connectors/connections/{connectionId}/resume:
    post:
      operationId: resumeConnectorConnection
      tags: [connectors]
      summary: Resume synchronization with active consent
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Active connection
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorConnection" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /connectors/connections/{connectionId}/revoke:
    post:
      operationId: revokeConnectorConnection
      tags: [connectors]
      summary: Revoke authorization and choose imported-data disposition
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeConnectorRequest" }
      responses:
        "200":
          description: Locally revoked connection; corrected or detached records are preserved
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorConnection" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lh_sid
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
    Forbidden:
      description: Adult account required
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
    NotFound:
      description: Generic non-enumerating not found response
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
    Conflict:
      description: Connector state or consent conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
    RateLimited:
      description: Provider rate limit after bounded retries
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
    ProviderFailure:
      description: Redacted provider failure
      content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorErrorResponse" } } }
  schemas:
    ConnectorDefinition:
      type: object
      additionalProperties: false
      required: [connectorKey, displayName, provider, category, version, status, authenticationModes, capabilities, sourceObjectTypes, targetEntityTypes, syncModes, minimumRequiredScopes, optionalScopes, sensitivity, documentation]
      properties:
        connectorKey: { type: string }
        displayName: { type: string }
        provider: { type: string }
        category: { type: string, enum: [calendar, communications, media, health, finance, home, device, file_import] }
        version: { type: string }
        status: { type: string, enum: [available, deferred, unsupported, prohibited] }
        authenticationModes: { type: array, items: { type: string, enum: [oauth2, file_upload, api_token, device_permission, local_bridge] } }
        capabilities: { type: array, items: { type: string } }
        sourceObjectTypes: { type: array, items: { type: string } }
        targetEntityTypes: { type: array, items: { type: string } }
        syncModes: { type: array, items: { type: string } }
        minimumRequiredScopes: { type: array, items: { type: string } }
        optionalScopes: { type: array, items: { type: string } }
