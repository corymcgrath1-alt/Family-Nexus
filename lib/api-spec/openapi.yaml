openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Lighthouse API - consent-native family intelligence operating system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: family-members
    description: Family member profiles and preferences
  - name: experiences
    description: Experience recommendations and interactions
  - name: invitations
    description: Invitation builder and RSVP flow
  - name: calendar-events
    description: Shared family calendar
  - name: planning-tasks
    description: Planning tasks for upcoming events
  - name: memories
    description: Saved experience ideas and memories
  - name: reflections
    description: Post-experience reflections
  - name: messages
    description: Family messages
  - name: shortlist
    description: Shortlisted experiences
  - name: today
    description: Today dashboard summary
  - name: connectors
    description: Read-only connector capability catalog
  - name: library
    description: Family Library records and privacy-safe manual import

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /family-members:
    get:
      operationId: listFamilyMembers
      tags: [family-members]
      summary: List all family members
      responses:
        "200":
          description: List of family members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyMember"

  /family-members/{id}:
    get:
      operationId: getFamilyMember
      tags: [family-members]
      summary: Get a family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "404":
          description: Not found

  /family-members/{id}/profile:
    get:
      operationId: getMemberProfile
      tags: [family-members]
      summary: Get experience profile for a family member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experience profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceProfile"
        "404":
          description: Not found
    patch:
      operationId: updateMemberProfile
      tags: [family-members]
      summary: Update experience profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceProfile"

  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: List experience recommendations
      parameters:
        - name: timeframe
          in: query
          schema:
            type: string
            enum:
              [
                right-now,
                this-week,
                this-weekend,
                this-month,
                this-season,
                this-year,
                surprise,
              ]
        - name: participants
          in: query
          schema:
            type: string
        - name: maxCost
          in: query
          schema:
            type: number
        - name: maxDistance
          in: query
          schema:
            type: number
        - name: energyLevel
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: setting
          in: query
          schema:
            type: string
            enum: [home, indoor, outdoor, any]
        - name: needsChildcare
          in: query
          schema:
            type: boolean
        - name: surpriseMode
          in: query
          schema:
            type: boolean
        - name: savedOnly
          in: query
          schema:
            type: boolean
        - name: shortlistedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"

  /experiences/search:
    get:
      operationId: searchExperiences
      tags: [experiences]
      summary: Natural language experience search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: viewerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results with parsed filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceSearchResult"

  /experiences/{id}:
    get:
      operationId: getExperience
      tags: [experiences]
      summary: Get a single experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experience detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "404":
          description: Not found

  /experiences/{id}/save:
    post:
      operationId: saveExperience
      tags: [experiences]
      summary: Save or unsave an experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceActionInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /experiences/{id}/hide:
    post:
      operationId: hideExperience
      tags: [experiences]
      summary: Hide or unhide an experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceActionInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /experiences/{id}/shortlist:
    post:
      operationId: shortlistExperience
      tags: [experiences]
      summary: Add or remove experience from shortlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceActionInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List all invitations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                pending,
                accepted,
                suggested-change,
                needs-info,
                declined,
                cancelled,
              ]
        - name: memberId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Create a new invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"

  /invitations/{id}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Get an invitation by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Not found
    patch:
      operationId: updateInvitation
      tags: [invitations]
      summary: Update invitation or submit RSVP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationUpdate"
      responses:
        "200":
          description: Updated invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Not found

  /calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [calendar-events]
      summary: List calendar events
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar-events]
      summary: Add event to shared calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /planning-tasks:
    get:
      operationId: listPlanningTasks
      tags: [planning-tasks]
      summary: List planning tasks
      parameters:
        - name: calendarEventId
          in: query
          schema:
            type: string
        - name: invitationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of planning tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningTask"

  /planning-tasks/{id}:
    patch:
      operationId: updatePlanningTask
      tags: [planning-tasks]
      summary: Update a planning task (toggle complete, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningTaskUpdate"
      responses:
        "200":
          description: Updated planning task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningTask"

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List experience memories
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, postponed, completed, archived]
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Save a memory or idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update memory status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /reflections:
    get:
      operationId: listReflections
      tags: [reflections]
      summary: List post-experience reflections
      responses:
        "200":
          description: List of reflections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reflection"
    post:
      operationId: createReflection
      tags: [reflections]
      summary: Submit a post-experience reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionInput"
      responses:
        "201":
          description: Created reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reflection"

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List family messages
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /today:
    get:
      operationId: getTodaySummary
      tags: [today]
      summary: Get today dashboard summary
      parameters:
        - name: viewerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Today summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummary"

  /connectors/catalog:
    get:
      operationId: listConnectorCatalog
      tags: [connectors]
      summary: List connector capabilities
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deterministically ordered connector catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCatalogResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connectors/catalog/{connectorId}:
    get:
      operationId: getConnectorCatalog
      tags: [connectors]
      summary: Get one connector capability
      security:
        - cookieAuth: []
      parameters:
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            maxLength: 80
      responses:
        "200":
          description: Registered connector capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCatalogDetailResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Connector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /library/import/preview:
    post:
      operationId: previewLibraryImport
      tags: [library]
      summary: Preview a private Family Library JSON import
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryItemImportDocument"
      responses:
        "200":
          description: Sanitized import candidate with discard warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryImportPreview"
        "400":
          description: Malformed or unsupported import document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Adult account required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Import document exceeds the payload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: JSON content type required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /library/import:
    post:
      operationId: commitLibraryImport
      tags: [library]
      summary: Create a private Family Library copy from JSON
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryImportCommitRequest"
      responses:
        "201":
          description: Actor-owned private Library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Confirmation, format, connector, or payload validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Adult account required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Import document exceeds the payload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: JSON content type required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lh_sid
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string

    ConnectorStatus:
      type: string
      enum: [available, deferred, unsupported, prohibited]

    ConnectorCollectionMode:
      type: string
      enum:
        [
          manual-upload,
          live-oauth-api,
          periodic-api,
          user-authorized-platform-collector,
          data-portability-export,
          local-only,
          unsupported,
          prohibited,
        ]

    ConnectorDataCategory:
      type: string
      enum:
        [
          family-library-records,
          documents,
          household-records,
          app-usage,
          screen-time,
          health-data,
          google-portability-exports,
          social-media-history,
          device-telemetry,
          device-or-app-behavior,
        ]

    ConnectorAllowedPurpose:
      type: string
      enum:
        [
          remember,
          search,
          user-directed-import,
          user-directed-export,
          personal-insight,
          household-coordination,
        ]

    ConnectorTermsReviewStatus:
      type: string
      enum: [reviewed, review-required, unsupported, prohibited]

    ConnectorSensitivityClass:
      type: string
      enum: [standard, personal, sensitive, restricted]

    ConnectorDefinition:
      type: object
      additionalProperties: false
      required:
        [
          id,
          provider,
          displayName,
          description,
          dataCategories,
          collectionMode,
          status,
          requiredScopes,
          authorizationRequirements,
          allowedPurposes,
          prohibitedUses,
          sensitivity,
          refreshLimitations,
          regionalPlatformLimitations,
          termsReviewStatus,
          importSupport,
          exportSupport,
          unavailableReason,
          canCollectAnotherAdultData,
        ]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
        provider:
          type: string
        displayName:
          type: string
        description:
          type: string
        dataCategories:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorDataCategory"
        collectionMode:
          $ref: "#/components/schemas/ConnectorCollectionMode"
        status:
          $ref: "#/components/schemas/ConnectorStatus"
        requiredScopes:
          type: array
          items:
            type: string
        authorizationRequirements:
          type: array
          items:
            type: string
        allowedPurposes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorAllowedPurpose"
        prohibitedUses:
          type: array
          items:
            type: string
        sensitivity:
          $ref: "#/components/schemas/ConnectorSensitivityClass"
        refreshLimitations:
          type: string
        regionalPlatformLimitations:
          type: array
          items:
            type: string
        termsReviewStatus:
          $ref: "#/components/schemas/ConnectorTermsReviewStatus"
        importSupport:
          type: boolean
        exportSupport:
          type: boolean
        unavailableReason:
          type: [string, "null"]
        canCollectAnotherAdultData:
          type: boolean
          const: false

    ConnectorCatalogResponse:
      type: object
      additionalProperties: false
      required: [catalogVersion, connectors]
      properties:
        catalogVersion:
          type: string
          const: connector-catalog.v1
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorDefinition"

    ConnectorCatalogDetailResponse:
      type: object
      additionalProperties: false
      required: [catalogVersion, connector]
      properties:
        catalogVersion:
          type: string
          const: connector-catalog.v1
        connector:
          $ref: "#/components/schemas/ConnectorDefinition"

    LibraryItemCategory:
      type: string
      enum:
        [
          note,
          document-reference,
          instruction,
          decision,
          memory,
          medical-reference,
          household-record,
          vehicle-record,
          career-record,
          other,
        ]

    LibraryItemSensitivity:
      type: string
      enum: [standard, personal, sensitive, restricted]

    LibraryItemRetentionPolicy:
      type: string
      enum:
        [keep-until-archived, review-annually, delete-after-date, legal-hold]

    LibraryItemExportProvenance:
      type: object
      additionalProperties: false
      properties:
        sourceType:
          type: string
          maxLength: 80
        sourceLabel:
          type: [string, "null"]
          maxLength: 260
        note:
          type: [string, "null"]
          maxLength: 1000
        recordedByUserId:
          type: integer
        correctedByUserId:
          type: integer
        correctedAt:
          type: string
          format: date-time
        connectorId:
          type: string
        originalFormatVersion:
          type: string
        importedAt:
          type: string
          format: date-time
        originalSourceLabel:
          type: [string, "null"]
          maxLength: 260

    LibraryItemImportSource:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryItemCategory"
        body:
          type: [string, "null"]
          maxLength: 12000
        sourceLabel:
          type: [string, "null"]
          maxLength: 260
        effectiveDate:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        sensitivity:
          $ref: "#/components/schemas/LibraryItemSensitivity"
        retentionPolicy:
          $ref: "#/components/schemas/LibraryItemRetentionPolicy"
        retentionDeleteAfter:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        provenance:
          $ref: "#/components/schemas/LibraryItemExportProvenance"
        id:
          type: integer
        householdId:
          type: integer
        ownerUserId:
          type: integer
        subjectUserId:
          type: [integer, "null"]
        ownerKind:
          type: string
        visibility:
          type: string
        sourceType:
          type: string
        allowedPurposes:
          type: array
          items:
            type: string
        status:
          type: string
        version:
          type: integer
        createdById:
          type: integer
        updatedById:
          type: integer
        archivedAt:
          type: [string, "null"]
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        grants:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: integer
              granteeUserId:
                type: integer
              permission:
                type: string
              purpose:
                type: string
              createdAt:
                type: string
                format: date-time
              revokedAt:
                type: [string, "null"]
                format: date-time
              expiresAt:
                type: [string, "null"]
                format: date-time

    LibraryItemImportDocument:
      type: object
      additionalProperties: false
      required: [formatVersion, item]
      properties:
        connectorId:
          type: string
          default: manual-family-library
          maxLength: 80
        formatVersion:
          type: string
          const: library-item.v1
        exportedAt:
          type: string
          format: date-time
        item:
          $ref: "#/components/schemas/LibraryItemImportSource"

    LibraryImportCandidate:
      type: object
      additionalProperties: false
      required:
        [
          title,
          category,
          body,
          sourceLabel,
          effectiveDate,
          sensitivity,
          retentionPolicy,
          retentionDeleteAfter,
          provenanceNote,
          visibility,
